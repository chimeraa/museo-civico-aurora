spring.application.name=museo-civico-aurora

# Data source: credentials come only from the environment (no real secret in the repo).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/museo_civico_aurora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Flyway is the sole DDL source; Hibernate only validates the migrated schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Session cookie: HttpOnly and SameSite=Lax explicit, Secure off for local HTTP.
# HTTPS deployments enable Secure via the "https" profile.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Development admin seed: env-only. No default secret; skipped when blank.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# CSRF cookie: always SameSite=Lax in the repository; Secure is off for local
# HTTP and switched on by the "https" profile.
app.csrf.cookie.secure=false
